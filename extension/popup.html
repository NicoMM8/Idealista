<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>UMBRAL Bridge</title>
  <style>
    body {
      width: 290px;
      margin: 0;
      padding: 14px;
      background: #F3EFE6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      color: #181614;
      line-height: 1.4;
      border: 2px solid #181614;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #181614;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 9px;
      height: 9px;
      background: #C2E24E;
      border-radius: 50%;
      box-shadow: 0 0 6px #C2E24E;
      display: inline-block;
    }
    .stat-box {
      background: #fff;
      border: 1px solid #181614;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .stat-val {
      font-size: 24px;
      font-weight: 800;
      color: #B84A32;
      font-family: Georgia, serif;
    }
    .stat-lbl {
      font-size: 10px;
      text-transform: uppercase;
      color: #666;
    }
    .btn {
      width: 100%;
      background: #B84A32;
      color: #fff;
      border: 1.5px solid #181614;
      padding: 9px 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 2px 2px 0 #181614;
      margin-bottom: 8px;
    }
    .btn:hover {
      background: #181614;
    }
    .btn-secondary {
      background: #fff;
      color: #181614;
    }
    .input-url {
      width: 100%;
      background: #fff;
      border: 1px solid #181614;
      padding: 5px;
      font-size: 11px;
      font-family: monospace;
      box-sizing: border-box;
      margin-top: 4px;
      margin-bottom: 8px;
    }
    .status-msg {
      font-size: 11px;
      padding: 6px;
      background: #E6EFEA;
      border-left: 3px solid #264636;
      display: none;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title"><span class="dot"></span>UMBRAL BRIDGE</div>
    <span id="badge-portal" style="font-size:9.5px;background:#181614;color:#F3EFE6;padding:2px 6px;font-family:monospace;">ACTIVO</span>
  </div>

  <div class="stat-box">
    <div>
      <div class="stat-val" id="pop-count">0</div>
      <div class="stat-lbl">Pisos detectados</div>
    </div>
    <button class="btn" id="pop-btn-sync" style="width:auto;margin:0;padding:6px 10px;">SINCRONIZAR ⚡</button>
  </div>

  <div id="pop-status" class="status-msg"></div>

  <div style="font-size:10px;color:#555;text-transform:uppercase;font-weight:600;margin-top:8px;">Destino de tu Observatorio:</div>
  <input type="text" id="pop-input-url" class="input-url" value="http://localhost:8050" />

  <button class="btn btn-secondary" id="pop-btn-open-umbral">ABRIR MI OBSERVATORIO UMBRAL ↗</button>

  <script src="popup.js"></script>
</body>
</html>
